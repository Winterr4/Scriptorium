<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1410;--c2:#2a1d16;--c3:#3a2a20;--wine:#7a2433;--pine:#2f4a3a;--ink:#ecdfc2;--mut:#a8977a;--gold:#c0993f;--red:#b8433f;--amb:#d09a3a;--grn:#5f9a6a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Source Sans 3',system-ui,sans-serif}
body{background-image:radial-gradient(ellipse at 20% 0,#33231a 0,transparent 60%),radial-gradient(ellipse at 90% 100%,#241a2a 0,transparent 55%);min-height:100vh;padding:env(safe-area-inset-top) 0 0}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:.2em 0;font-weight:700;letter-spacing:.01em}
h1{font-size:2.1rem}h2{font-size:1.5rem}h3{font-size:1.2rem;color:var(--gold)}
#app{max-width:560px;margin:0 auto;padding:14px 16px calc(190px + env(safe-area-inset-bottom))}
.card{background:linear-gradient(180deg,var(--c2),#231812);border:1px solid #4a3626;border-radius:10px 10px 12px 12px;padding:14px;margin:12px 0;box-shadow:inset 0 0 0 3px #1c1410,inset 0 0 0 4px #3d2d20}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.btn{background:var(--wine);color:var(--ink);border:1px solid #a04555;border-radius:10px;padding:12px 16px;font:600 1rem 'Source Sans 3',sans-serif;min-height:46px}
.btn.g{background:var(--pine);border-color:#4f7a60}.btn.o{background:transparent;border-color:#5a4533;color:var(--mut)}.btn.s{padding:6px 10px;min-height:34px;font-size:.9rem}
.btn:active{transform:scale(.97)}.btn.on{outline:2px solid var(--gold)}
.chip{padding:7px 12px;border-radius:20px;background:var(--c3);border:1px solid #5a4533;font-size:.95rem}.chip.on{background:var(--pine);border-color:var(--gold)}
.mut{color:var(--mut);font-size:.9rem}.big{font:700 2rem 'Cormorant Garamond',serif;color:var(--gold)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.book{position:relative;background:linear-gradient(90deg,#4d1722,var(--wine) 12%,#5b1b28);border:1px solid #a04555;border-radius:4px 10px 10px 4px;padding:18px 12px;min-height:110px;text-align:left;color:var(--ink);box-shadow:4px 4px 0 #120c08}
.book:nth-child(3n+2){background:linear-gradient(90deg,#1f3528,var(--pine) 12%,#2a4334);border-color:#4f7a60}.book:nth-child(3n){background:linear-gradient(90deg,#4a3519,#6a4d24 12%,#5a4120);border-color:var(--gold)}
.book b{font:700 1.3rem 'Cormorant Garamond',serif;display:block}.badge{position:absolute;top:-8px;right:-8px;background:var(--gold);color:#1c1410;border-radius:12px;padding:1px 8px;font-weight:700;font-size:.85rem}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}.hm i{aspect-ratio:1;border-radius:2px;background:#2d2119}
.hm .l1{background:#3b4a2e}.hm .l2{background:#55723c}.hm .l3{background:#7a9a45}.hm .l4{background:#c0993f}

#focus[hidden]{display:none}#tree{font-size:7rem;transition:all .5s}#tm{font:700 3.4rem 'Cormorant Garamond',serif;color:var(--gold)}

.pair{margin-bottom:8px;min-height:60px;font-size:.92rem;background:var(--c3);border:1px solid #5a4533;border-radius:10px;color:var(--ink);padding:8px;width:100%}.pair.sel{outline:2px solid var(--gold)}.pair.ok{background:var(--pine);opacity:.45}.pair.bad{background:var(--wine)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

<body><div id="app"></div><div id="modal" data-a="closeBg"><div id="mb"></div></div><div id="focus" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<input type="file" id="imp" accept="application/json" hidden>
<script>
/* ===== 1. ESTADO Y ALMACENAMIENTO (modelo versionado v1) ===== */
window.addEventListener('error',e=>{const a=document.getElementById('app');if(a)a.insertAdjacentHTML('afterbegin','<div class="card" style="border-color:#b8433f">⚠️ Error: '+String(e.message).replace(/</g,'&lt;')+' (línea '+e.lineno+')</div>')});
const MEM={};const LS={get(k){try{return localStorage.getItem(k)}catch(e){return MEM[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){MEM[k]=v}}};
/* ===== CUENTAS (Supabase). Pega aquí tus datos; si están vacíos la app funciona en modo local ===== */
const SB_URL='https://akqhsjryjouatwllmtcm.supabase.co',SB_KEY='sb_publishable_jUe2HdQSNpNLkD3r2GPUUA_2nwlXk2l';
let KEY='scriptorium.v1';
const load=()=>{try{const d=JSON.parse(LS.get(KEY));if(d&&d.studies)return d}catch(e){}return{v:1,studies:[]}};
let S=load();let sb=null,USER=null,pushT=null;
const save=()=>{S.ts=Date.now();LS.set(KEY,JSON.stringify(S));push()};
let UI={view:'home',sid:null,tab:'foco',rev:null,t:null,sel:null,mode:'pomo',dur:25,rate:null,wx:LS.get('scr.wx')||''};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const cur=()=>S.studies.find(s=>s.id===UI.sid);
const DAY=864e5,fmtH=m=>(m/60).toFixed(1)+' h';
const QUOTES=['«Creer en las propias capacidades cambia lo que se logra.» — Bandura','«Lo que hoy hace el niño con ayuda, mañana lo hará solo.» — Vygotsky','«La educación es lo que sobrevive cuando se ha olvidado lo aprendido.» — Skinner','«El optimismo se aprende.» — Seligman','«Recuperar de memoria enseña más que releer.» — Roediger','«Lo difícil bien practicado es lo que queda.» — Bjork'];

/* ===== 2. UTILIDADES DE STATS ===== */
const allSess=()=>S.studies.flatMap(s=>s.sessions);
function streak(ss){const d=new Set(ss.map(x=>ld(x.date)));let n=0,t=Date.now();if(!d.has(ld(t)))t-=DAY;while(d.has(ld(t))){n++;t-=DAY}return n}
function sumMin(ss,days){const lim=Date.now()-days*DAY,f=ss.filter(x=>x.date>=lim);return{h:f.reduce((a,x)=>a+x.min,0),e:f.reduce((a,x)=>a+x.min*x.eff/5,0)}}
function heat(ss){const m={};ss.forEach(x=>{const k=ld(x.date);m[k]=(m[k]||0)+x.min});const t=new Date();t.setHours(12);const dow=(t.getDay()+6)%7;let h='';
 for(let i=17*7-1-(6-dow);i>=-(6-dow);i--){const d=new Date(t-i*DAY),k=ld(d),v=m[k]||0,l=!v?0:v<30?1:v<60?2:v<120?3:4;h+=`<i class="l${l}" title="${k}: ${v} min"></i>`}
 return`<div class="hm">${h}</div>`}
function bestSlot(ss){const g={};ss.forEach(x=>{const h=new Date(x.date).getHours(),k=h>=6&&h<12?'mañana ☀️':h>=12&&h<19?'tarde 🌤️':'noche 🌙';(g[k]=g[k]||[]).push((x.eff+(x.ar||3))/2)});
 const r=Object.entries(g).filter(([,v])=>v.length>=2).map(([k,v])=>[k,v.reduce((a,b)=>a+b)/v.length]).sort((a,b)=>b[1]-a[1]);return r[0]}

/* ===== 3. ALGORITMO SRS (SM-2 simplificado) ===== */
const newCard=(deck,type,f,b)=>({id:uid(),deck,type,f,b,ease:2.5,int:0,reps:0,lapses:0,due:0,last:0,ok:true,seen:false});
function grade(c,g){const now=Date.now();c.seen=true;c.last=now;
 if(g===0){c.reps=0;c.lapses++;c.int=0;c.ease=Math.max(1.3,c.ease-.2);c.due=now+10*60e3;c.ok=false}
 else{c.ok=true;c.reps++;c.int=c.reps===1?1:c.reps===2?(g===1?3:6):Math.round(c.int*c.ease*(g===1?.8:g===3?1.3:1));c.ease=Math.max(1.3,c.ease+(g===1?-.15:g===3?.15:0));c.due=now+c.int*DAY}}
const retention=c=>!c.seen?0:Math.round(100*Math.pow(.9,(Date.now()-c.last)/DAY/Math.max(.5,c.int||.5)));
const mastery=c=>!c.seen?'#6b5a48':!c.ok?'var(--red)':(c.reps>=3&&!c.lapses)||c.reps>=6?'var(--grn)':'var(--amb)';
const dueCards=(s,t)=>s.cards.filter(c=>c.due<=Date.now()&&(!t||c.topic===t));
const clozeF=t=>E(t).replace(/\{\{(.+?)\}\}/g,'<span class="cl">[...]</span>'),clozeB=t=>E(t).replace(/\{\{(.+?)\}\}/g,'<span class="cl">$1</span>');

/* ===== 4. VISTAS ===== */
function ensure(){S.plan=S.plan||[];S.qs=S.qs||{seen:[],day:'',i:0};S.set=Object.assign({lang:'es',pomo:25,quote:true,wx:true},S.set||{});if(UI.dp!==S.set.pomo){UI.dp=S.set.pomo;UI.dur=S.set.pomo}}
function render(){ensure();const a=$('#app');a.innerHTML=UI.view==='auth'?vAuth():UI.view==='load'?'<p class="mut" style="text-align:center;padding-top:90px">🕯️ Abriendo tu estudio…</p>':UI.view==='home'?vHome():UI.view==='gs'?vGS():UI.view==='pl'?vPL():UI.view==='set'?vSet():vStudy();tr(a)}
function vHome(){const ss=allSess(),w=sumMin(ss,7),due=S.studies.reduce((n,s)=>n+dueCards(s).length,0),eff=ss.length?(ss.reduce((a,x)=>a+x.eff,0)/ss.length).toFixed(1):'–';
 const q=QUOTES[new Date().getDate()%QUOTES.length];
 return`<div class="page"><div class="row sp"><h1><span class="flick">🕯️</span> Scriptorium</h1><span style="font-size:1.6rem">${S.set.wx&&UI.wx||'🦉'} <button class="btn o s" data-a="cfg">⚙️</button></span></div>
 ${USER?`<div class="mut">👤 ${E(uname())} · <span id="sy">${syncTxt()}</span></div>`:sb?'':`<div class="card mut">💾 Modo local: tus datos solo viven en este navegador. Haz backup JSON.<br>${UI.why==='lib'?'⚠️ No cargó la librería de la nube (revisa conexión o bloqueadores).':'⚠️ Faltan la URL y la clave de la nube.'}<div style="margin-top:8px"><button class="btn s g" data-a="cloud">☁️ Conectar nube</button></div></div>`}
 ${S.set.quote?(()=>{const z=qod();return`<div class="card" style="font-style:italic">${z[0]} ${S.set.lang==='en'?z[2]:z[1]}</div>`})():''}
 <h3>📅 Hoy te toca</h3><div class="card">${S.plan.filter(t=>t.wk===mon(Date.now())&&t.day===todayI()).map(t=>`<div class="row sp" style="padding:6px 0" data-a="ptD" data-id="${t.id}"><span>${t.done?'✅':'⬜'} ${E(t.text)}</span><span class="mut">${t.h} h</span></div>`).join('')||'<span class="mut">Nada planificado hoy.</span>'}<div style="margin-top:8px"><button class="btn s g" data-a="pl">📅 Abrir planner</button></div></div>
 ${due?`<div class="card" style="border-color:var(--gold)">🔔 Toca repasar: <b>${due}</b> tarjeta${due>1?'s':''}</div>`:(nextDue(S.studies.flatMap(s=>s.cards))?`<div class="card">⏰ Próximo repaso <b>${nextDue(S.studies.flatMap(s=>s.cards))}</b></div>`:'')}
 <h3>Mi estantería</h3><div class="shelf">${S.studies.map(s=>`<button class="book" data-a="open" data-id="${s.id}">${dueCards(s).length?`<span class="badge">${dueCards(s).length}</span>`:''}<span style="font-size:1.8rem">${s.icon}</span><b>${E(s.name)}</b><span class="mut">${fmtH(s.sessions.reduce((a,x)=>a+x.min,0))}</span></button>`).join('')}
 <button class="book" style="background:transparent;border:2px dashed #5a4533;box-shadow:none;text-align:center" data-a="newStudy"><span style="font-size:1.8rem">➕</span><b>Nuevo estudio</b></button></div>
 <h3>Hábito global</h3><div class="card"><div class="grid3"><div><div class="big">${fmtH(ss.reduce((a,x)=>a+x.min,0))}</div><div class="mut">totales</div></div><div><div class="big">${streak(ss)}🔥</div><div class="mut">racha</div></div><div><div class="big">${eff}</div><div class="mut">eficiencia /5</div></div></div>
 <p class="mut">Esta semana: ${fmtH(w.h)} · eficientes ${fmtH(w.e)}</p>${heat(ss)}</div>
 <button class="btn" style="width:100%;margin:8px 0" data-a="gs">📊 Mis stats y perfil de estudio</button><div class="row"><button class="btn o s" data-a="pl">📅 Planner</button><button class="btn o s" data-a="cfg">⚙️ Ajustes</button></div></div>`}

function vStudy(){const s=cur();if(!s){UI.view='home';return vHome()}
 const T=[['foco','⏱️','Foco'],['repaso','🧠','Repaso'],['libro','📖','Librito'],['plan','✅','Plan'],['stats','📊','Stats']];
 const body={foco:tFoco,repaso:tRepaso,libro:tLibro,plan:tPlan,stats:tStats}[UI.tab](s);
 return`<div class="page"><div class="row sp"><button class="btn o s" data-a="home">← Estantería</button><button class="btn o s" data-a="studyMenu">⋯</button></div>
 <h2>${s.icon} ${E(s.name)}</h2>${dueCards(s).length&&UI.tab!=='repaso'&&!UI.t?`<button class="card" style="width:100%;color:inherit;border-color:var(--gold)" data-a="tab" data-id="repaso">🔔 Toca repasar: ${dueCards(s).length}</button>`:''}${body}</div><div class="tabs">${T.map(t=>`<button class="${UI.tab===t[0]?'on':''}" data-a="tab" data-id="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div>`}

function tFoco(s){const tp=UI.sel||s.topics[0]?.id;
 return`<div class="card"><h3>Tema</h3><div class="row">${s.topics.map(t=>`<button class="chip ${t.id===tp?'on':''}" data-a="pick" data-id="${t.id}">${E(t.name)}</button>`).join('')}<button class="chip" data-a="addTopic">＋ tema</button></div>
 <h3>Modo</h3><div class="row"><button class="chip ${UI.mode==='pomo'?'on':''}" data-a="mode" data-id="pomo">🍅 Pomodoro</button><button class="chip ${UI.mode==='free'?'on':''}" data-a="mode" data-id="free">⏲️ Cronómetro</button></div>
 ${UI.mode==='pomo'?`<div class="row" style="margin-top:8px">${[15,25,45,60].map(d=>`<button class="chip ${UI.dur===d?'on':''}" data-a="dur" data-id="${d}">${d} min</button>`).join('')}</div>`:''}
 <p><button class="btn g" style="width:100%" data-a="start">🌱 Plantar y empezar</button></p>
 <p class="mut">Si abandonas, solo queda la semillita 🌱. Si completas la sesión, crece el arbolito 🌳</p></div>
 <h3>Mi bosque</h3><div class="card" style="font-size:1.6rem;letter-spacing:2px">${s.forest.length?s.forest.slice(-60).map(f=>f.ok?'🌳':'🌱').join(''):'<span class="mut" style="font-size:1rem">Aún no hay árboles. Planta el primero.</span>'}</div>`}

function tops(s){return`<div class="row" style="margin:8px 0"><button class="chip ${!UI.rt?'on':''}" data-a="rtp" data-id="">Todos</button>${s.topics.map(t=>`<button class="chip ${UI.rt===t.id?'on':''}" data-a="rtp" data-id="${t.id}">${E(t.name)}</button>`).join('')}</div>`}
function nextDue(cs){const f=cs.filter(c=>c.due>Date.now()).map(c=>c.due).sort((a,b)=>a-b)[0];if(!f)return'';const m=Math.round((f-Date.now())/6e4);return m<60?`en ${Math.max(1,m)} min`:m<1440?`en ${Math.round(m/60)} h`:new Date(f).toLocaleDateString('es',{weekday:'long',hour:'2-digit',minute:'2-digit'})}
function tRepaso(s){
 if(UI.g)return vGame(s);
 if(UI.rev){const r=UI.rev,c=s.cards.find(x=>x.id===r.q[r.i]);if(!c){UI.rev=null;return tRepaso(s)}
  const fr=c.type==='cloze'?clozeF(c.f):E(c.f),bk=c.type==='cloze'?clozeB(c.f):E(c.b);
  return`<div class="mut">${r.i+1} / ${r.q.length}</div><div class="card"><div class="flash">${r.show?bk:fr}</div></div>
  ${r.show?`<div class="grid3" style="grid-template-columns:repeat(4,1fr)">${['Otra','Difícil','Bien','Fácil'].map((n,i)=>`<button class="btn s" style="${i===0?'':'background:var(--pine)'}" data-a="grade" data-id="${i}">${n}</button>`).join('')}</div>`:`<button class="btn" style="width:100%" data-a="reveal">Mostrar respuesta</button>`}
  <p><button class="btn o s" data-a="endRev">Salir</button></p>`}
 const d=dueCards(s,UI.rt),tc=UI.rt?s.cards.filter(c=>c.topic===UI.rt):s.cards,nd=nextDue(tc),prop=tc.filter(c=>c.seen).sort((a,b)=>retention(a)-retention(b)).slice(0,3);
 return`${tops(s)}<div class="card"><div class="row sp"><div><div class="big">${d.length}</div><div class="mut">toca repasar ya</div></div><button class="btn" data-a="review" ${d.length?'':'disabled style="opacity:.4"'}>Repasar ahora</button></div>
 ${!d.length&&nd?`<p>⏰ Próximo repaso <b>${nd}</b></p>`:''}
 ${prop.length?`<h3>🧠 Mejor repasar (curva del olvido)</h3>${prop.map(c=>`<div class="row sp"><span>${E(c.f.slice(0,38))}</span><b style="color:${retention(c)<70?'var(--red)':'var(--amb)'}">${retention(c)}%</b></div>`).join('')}<p class="mut">Repasar justo antes de olvidar fija más: práctica espaciada.</p>`:''}
 ${'Notification' in window&&Notification.permission==='default'?'<button class="btn s o" data-a="notif">🔔 Activar avisos (app abierta)</button>':''}</div>
 <div class="card"><h3>🎮 Minijuegos</h3><div class="row"><button class="btn g" data-a="gStart" data-id="match">🧩 Emparejar</button><button class="btn g" data-a="gStart" data-id="vf">⚡ V/F contrarreloj</button></div></div>
 <div class="row sp"><h3>Bancos</h3><button class="btn s g" data-a="addDeck">＋ Banco</button></div><p class="mut">Las tarjetas nuevas se guardan en el tema marcado arriba.</p>
 ${s.decks.map(k=>`<div class="card"><div class="row sp"><b>${E(k.name)}</b><span class="mut">${s.cards.filter(c=>c.deck===k.id).length} tarjetas</span></div>
 <div class="row" style="margin-top:8px"><button class="btn s" data-a="addCard" data-id="${k.id}">＋ Tarjeta</button><button class="btn s o" data-a="addCloze" data-id="${k.id}">＋ Hueco</button><button class="btn s o" data-a="delDeck" data-id="${k.id}">🗑️</button></div></div>`).join('')||'<p class="mut">Crea un banco para añadir tarjetas.</p>'}`}

function tLibro(s){const tc=(UI.rt?s.cards.filter(c=>c.topic===UI.rt):s.cards).slice().sort((a,b)=>(a.seen?retention(a):101)-(b.seen?retention(b):101)),n=k=>tc.filter(c=>c.seen&&mastery(c)===k).length,
 lab=c=>!c.seen?'nueva':mastery(c)==='var(--grn)'?'muy bien':mastery(c)==='var(--red)'?'fallada':'aprendiendo';
 return`${tops(s)}<div class="card"><div class="grid3"><div><span class="dot" style="background:var(--red)"></span> ${n('var(--red)')}<div class="mut">fallados</div></div><div><span class="dot" style="background:var(--amb)"></span> ${n('var(--amb)')}<div class="mut">aprendiendo</div></div><div><span class="dot" style="background:var(--grn)"></span> ${n('var(--grn)')}<div class="mut">muy bien</div></div></div></div>
 ${tc.map(c=>`<div class="card" style="margin:6px 0;padding:10px"><div class="row sp"><div class="row" style="flex:1;flex-wrap:nowrap"><span class="dot" style="background:${mastery(c)}"></span><span>${E(c.f.slice(0,60))}</span></div><b style="color:${mastery(c)}">${c.seen?retention(c)+'%':'–'}</b></div><div class="mut">${lab(c)} · ${c.reps} repasos seguidos · ${c.lapses} fallos${c.seen?' · próximo '+(c.due<=Date.now()?'ya':nextDue([c])):''}</div></div>`).join('')||'<p class="mut">El librito se llena al crear tarjetas.</p>'}
 <p class="mut">Verde: varios repasos sin fallar. Rojo: último repaso fallado. % = retención estimada ahora.</p>`}

function tPlan(s){const cols=[['todo','Por hacer'],['doing','En curso'],['done','Hecho']],tot=s.tasks.length,pc=tot?Math.round(100*s.tasks.filter(t=>t.col==='done').length/tot):0;
 const dl=s.tasks.filter(t=>t.due&&t.col!=='done').sort((a,b)=>a.due.localeCompare(b.due));
 return`<div class="card"><div class="row sp"><b>Avance</b><span>${pc}%</span></div><div class="bar"><div style="width:${pc}%"></div></div></div>
 <button class="btn" style="width:100%;margin:8px 0" data-a="pl">📅 Planner semanal</button><div class="row sp"><h3>Kanban</h3><button class="btn s g" data-a="addTask">＋ Tarea</button></div>
 ${cols.map(([k,n])=>`<div class="card"><b>${n}</b>${s.tasks.filter(t=>t.col===k).map(t=>{const d=t.steps.filter(x=>x.d).length;return`<div class="card row sp" style="margin:6px 0;padding:10px" data-a="task" data-id="${t.id}"><span>${E(t.text)}</span><span class="mut">${t.steps.length?d+'/'+t.steps.length:''} ${t.due?'📅'+t.due.slice(5):''}</span></div>`}).join('')||'<div class="mut">—</div>'}</div>`).join('')}

function qod(){const q=S.qs,t=ld(Date.now());if(q.day!==t||!QD[q.i]){let p=QD.map((_,i)=>i).filter(i=>!q.seen.includes(i));if(!p.length){q.seen=[];p=QD.map((_,i)=>i)}q.i=p[Math.floor(Math.random()*p.length)];q.seen.push(q.i);q.day=t;save()}return QD[q.i]}
